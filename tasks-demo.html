<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Me OS — Tasks & Exams Management Lead Demo</title>
  <style>
    :root {
      --bg-primary: #09090d;
      --bg-surface: #12121a;
      --bg-surface-elevated: #181824;
      --text-primary: #f3f4f8;
      --text-secondary: #9494a8;
      --text-muted: #5e5e76;
      --border-subtle: #1f1f2e;
      --border-focus: #2f2f48;
      --accent: #7c5cfc;
      --accent-glow: rgba(124, 92, 252, 0.35);
      --accent-dim: rgba(124, 92, 252, 0.12);
      --mint: #10b981;
      --amber: #f59e0b;
      --rose: #ef4444;
      --cyan: #06b6d4;
      --radius-sm: 10px;
      --radius-md: 14px;
      --nav-height: 64px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 80px;
      display: flex;
      justify-content: center;
    }

    .demo-app-container {
      width: 100%;
      max-width: 620px;
    }

    .demo-top-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-dim);
      border: 1px solid rgba(124, 92, 252, 0.3);
      color: #c4b5fd;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<div class="demo-app-container">
  <div style="text-align: center; margin-bottom: 24px;">
    <div class="demo-top-badge">Agent 4 Lead Specification</div>
    <h1 style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em;">Tasks & Exams <span>OS</span></h1>
    <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">Category Segmented Controls · Animated Checkbox · Quick Add Drawer · Realtime Stats</p>
  </div>

  <!-- Tasks Lead UI Mount Point -->
  <div id="tasksUiMount"></div>
</div>

<!-- Scripts -->
<script src="task-habit-engine.js"></script>
<script src="ui-tasks.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const component = new window.TasksUIComponent({
      container: '#tasksUiMount',
      defaultCategory: 'all'
    });
    window.demoComponent = component;
    console.log('TasksUIComponent loaded and mounted successfully:', component);
  });
</script>

</body>
</html>
