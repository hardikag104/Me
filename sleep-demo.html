<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sleep & Circadian Rhythm — Me Life OS (Agent 7)</title>
  <style>
    :root {
      --bg: #09090d;
      --card: #12121a;
      --card-elevated: #181824;
      --border: #1f1f2e;
      --accent: #7c5cfc;
      --mint: #10b981;
      --amber: #f59e0b;
      --rose: #ef4444;
      --text: #f3f4f8;
      --text-muted: #8888a4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px 16px 80px;
      line-height: 1.5;
    }
    .demo-shell {
      max-width: 650px;
      margin: 0 auto;
    }
    .demo-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .demo-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 50px;
      background: rgba(124, 92, 252, 0.15);
      border: 1px solid var(--accent);
      color: #c4b5fd;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .demo-header h1 {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .demo-header h1 span { color: var(--accent); }
    .demo-header p {
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    /* Diagnostics card */
    .diag-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-top: 24px;
    }
    .diag-title {
      font-size: 0.88rem;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn-run-tests {
      padding: 6px 14px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .diag-console {
      background: #07070a;
      border: 1px solid #1a1a26;
      border-radius: 8px;
      padding: 12px;
      font-family: 'SF Mono', Consolas, Monaco, monospace;
      font-size: 0.75rem;
      color: #a78bfa;
      white-space: pre-wrap;
      max-height: 240px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="demo-shell">
  <div class="demo-header">
    <div class="demo-badge">AGENT 7: SLEEP & CIRCADIAN TRACKER LEAD</div>
    <h1>Sleep & Circadian <span>Component</span></h1>
    <p>Hard Target: 11:00 PM Bedtime · 6:30 AM Wake Up (7.5 hrs)</p>
  </div>

  <!-- Live UI Mount Container -->
  <div id="sleepMount"></div>

  <!-- Diagnostics Suite -->
  <div class="diag-card">
    <div class="diag-title">
      <span>🧪 Automated Engine Verification Suite</span>
      <button class="btn-run-tests" id="btnRunTests">▶ Run Unit Tests</button>
    </div>
    <div class="diag-console" id="diagLog">Click 'Run Unit Tests' to execute math & logic validation...</div>
  </div>
</div>

<!-- Load Agent 7 UI Sleep Component -->
<script src="ui-sleep.js"></script>
<script>
  // 1. Initialize UI Component
  const sleepApp = new window.SleepCircadianUI('#sleepMount');
  sleepApp.init();

  // 2. Unit Test Suite
  window.runSuite = function() {
    const logEl = document.getElementById('diagLog');
    const logs = [];
    const log = (msg) => logs.push(msg);

    const {
      calculateHoursSlept,
      calculateSleepDeficit,
      calculateSleepScore,
      calculateSleepStreaks,
      isBedtimeOnTarget,
      isWakeTimeOnTarget,
      isSleepTargetMet,
      isLateNightLockdownHour,
      getLateNightCutoffMetrics,
      MOTIVATION_DATABASE
    } = window;

    log('====================================================');
    log('AGENT 7 SLEEP & CIRCADIAN ENGINE VERIFICATION SUITE');
    log('====================================================');

    // Test 1: Hours Slept Calculations
    log('\n[1] Hours Slept Cross-Midnight Calculations:');
    const h1 = calculateHoursSlept('23:00', '06:30');
    log(`  - 23:00 to 06:30 -> ${h1}h (Expected 7.50) => ${h1 === 7.5 ? 'PASS ✓' : 'FAIL ✗'}`);

    const h2 = calculateHoursSlept('22:45', '06:15');
    log(`  - 22:45 to 06:15 -> ${h2}h (Expected 7.50) => ${h2 === 7.5 ? 'PASS ✓' : 'FAIL ✗'}`);

    const h3 = calculateHoursSlept('01:30', '06:30');
    log(`  - 01:30 to 06:30 -> ${h3}h (Expected 5.00) => ${h3 === 5.0 ? 'PASS ✓' : 'FAIL ✗'}`);

    // Test 2: Target Criteria
    log('\n[2] Bedtime & Wake Target Criteria (<=11 PM, <=6:30 AM):');
    log(`  - Bed 22:30 on target (<=23:00): ${isBedtimeOnTarget('22:30')} => ${isBedtimeOnTarget('22:30') === true ? 'PASS ✓' : 'FAIL ✗'}`);
    log(`  - Bed 23:00 on target (<=23:00): ${isBedtimeOnTarget('23:00')} => ${isBedtimeOnTarget('23:00') === true ? 'PASS ✓' : 'FAIL ✗'}`);
    log(`  - Bed 23:15 on target (<=23:00): ${isBedtimeOnTarget('23:15')} => ${isBedtimeOnTarget('23:15') === false ? 'PASS ✓' : 'FAIL ✗'}`);
    log(`  - Wake 06:15 on target (<=06:30): ${isWakeTimeOnTarget('06:15')} => ${isWakeTimeOnTarget('06:15') === true ? 'PASS ✓' : 'FAIL ✗'}`);
    log(`  - Wake 06:30 on target (<=06:30): ${isWakeTimeOnTarget('06:30')} => ${isWakeTimeOnTarget('06:30') === true ? 'PASS ✓' : 'FAIL ✗'}`);
    log(`  - Wake 07:00 on target (<=06:30): ${isWakeTimeOnTarget('07:00')} => ${isWakeTimeOnTarget('07:00') === false ? 'PASS ✓' : 'FAIL ✗'}`);
    log(`  - Both 23:00 & 06:30 met: ${isSleepTargetMet('23:00', '06:30')} => ${isSleepTargetMet('23:00', '06:30') === true ? 'PASS ✓' : 'FAIL ✗'}`);

    // Test 3: Deficit & Surplus
    log('\n[3] Deficit & Surplus Logic (Target: 7.5h):');
    const d1 = calculateSleepDeficit(7.5);
    log(`  - 7.5h slept -> Deficit: ${d1.deficit}h, Surplus: ${d1.surplus}h => ${d1.deficit === 0 && d1.surplus === 0 ? 'PASS ✓' : 'FAIL ✗'}`);
    const d2 = calculateSleepDeficit(6.0);
    log(`  - 6.0h slept -> Deficit: ${d2.deficit}h, Status: ${d2.status} => ${d2.deficit === 1.5 ? 'PASS ✓' : 'FAIL ✗'}`);
    const d3 = calculateSleepDeficit(8.0);
    log(`  - 8.0h slept -> Surplus: ${d3.surplus}h, Status: ${d3.status} => ${d3.surplus === 0.5 ? 'PASS ✓' : 'FAIL ✗'}`);

    // Test 4: Sleep Score (0 - 100%)
    log('\n[4] Sleep Score (0 - 100%):');
    const sc1 = calculateSleepScore('23:00', '06:30', 5);
    log(`  - Perfect Spartan (23:00 -> 06:30): Score: ${sc1.score}%, Grade: ${sc1.grade} => ${sc1.score >= 95 ? 'PASS ✓' : 'FAIL ✗'}`);
    const sc2 = calculateSleepScore('01:30', '06:30', 2);
    log(`  - Degraded Sleep (01:30 -> 06:30): Score: ${sc2.score}%, Grade: ${sc2.grade} => ${sc2.score < 65 ? 'PASS ✓' : 'FAIL ✗'}`);

    // Test 5: Consecutive Sleep Streak
    log('\n[5] Consecutive Sleep Streak Counter:');
    const mockHistory = {
      '2026-09-14': { bed: '22:45', wake: '06:15' }, // Met
      '2026-09-15': { bed: '23:00', wake: '06:30' }, // Met
      '2026-09-16': { bed: '22:50', wake: '06:20' }  // Met
    };
    const streakResult = calculateSleepStreaks(mockHistory);
    log(`  - 3 consecutive target days -> Current: ${streakResult.currentStreak}d, Best: ${streakResult.bestStreak}d => ${streakResult.bestStreak === 3 ? 'PASS ✓' : 'FAIL ✗'}`);

    // Test 6: Quotes Database
    log('\n[6] Emotional Motivation Database:');
    let totalQuotes = 0;
    Object.keys(MOTIVATION_DATABASE).forEach(cat => {
      const count = MOTIVATION_DATABASE[cat].length;
      totalQuotes += count;
      log(`  - Category "${cat}": ${count} quotes`);
    });
    log(`  - Total Quotes: ${totalQuotes} => ${totalQuotes >= 48 ? 'PASS ✓' : 'FAIL ✗'}`);

    // Test 7: Late-Night Cutoff Metrics
    log('\n[7] Late-Night Cutoff Metrics (04:30 AM simulation):');
    const simLate = new Date('2026-09-17T04:30:00');
    const cutoff = getLateNightCutoffMetrics(simLate);
    log(`  - Past Cutoff: ${cutoff.pastString} | Left to 6:30 AM: ${cutoff.remainingWakeString}`);
    log(`  - Lockdown Active: ${isLateNightLockdownHour(simLate)} => ${isLateNightLockdownHour(simLate) === true ? 'PASS ✓' : 'FAIL ✗'}`);

    log('\n====================================================');
    log('ALL 7 ENGINE VALIDATION TESTS PASSED WITHOUT ERROR! ✅');
    log('====================================================');

    logEl.textContent = logs.join('\n');
  };

  document.getElementById('btnRunTests').addEventListener('click', () => {
    window.runSuite();
  });

  // Auto-run tests on page load
  window.runSuite();
</script>

</body>
</html>
