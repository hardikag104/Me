<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Somebody Told Me — Quick Capture Scratchpad Demo</title>
  <style>
    :root {
      --bg-primary: #09090d;
      --bg-surface: #12121a;
      --bg-surface-elevated: #1a1a24;
      --border-subtle: #1f1f2e;
      --border-focus: #2f2f48;
      --accent: #7c5cfc;
      --accent-glow: rgba(124, 92, 252, 0.35);
      --mint: #10b981;
      --amber: #f59e0b;
      --rose: #ef4444;
      --cyan: #06b6d4;
      --text-primary: #f3f4f8;
      --text-secondary: #9494a8;
      --text-muted: #5e5e76;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --nav-height: 64px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .demo-shell {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .demo-header {
      text-align: center;
      padding: 16px 0 8px;
    }
    .demo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      background: rgba(124, 92, 252, 0.14);
      border: 1px solid rgba(124, 92, 252, 0.35);
      color: #c4b5fd;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .demo-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .demo-title span {
      color: var(--accent);
    }
    .demo-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Task List Inspector Card (Shows converted tasks live!) */
    .task-inspector-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 10px;
    }
    .task-inspector-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .task-inspector-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .task-entry {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 0.82rem;
    }
    .task-entry:last-child {
      margin-bottom: 0;
    }

    /* Toast */
    #demoToast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #181824;
      border: 1px solid var(--accent);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 9999;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    #demoToast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="demo-shell">
  <!-- Header -->
  <div class="demo-header">
    <div class="demo-badge">Agent 6: Scratchpad Specialist</div>
    <h1 class="demo-title">Somebody <span>Told Me</span></h1>
    <p class="demo-subtitle">
      Zero-friction capture for verbal instructions, professor exam hints, and friend requests. 
      Filter by person, search in real-time, and convert to scheduled To-Do tasks with 1-click.
    </p>
  </div>

  <!-- Mounting point for Agent 6 UI Component -->
  <div id="scratchpadMount"></div>

  <!-- Agent 4 / Agent 2 To-Do Task List Live Inspector -->
  <div class="task-inspector-card">
    <div class="task-inspector-header">
      <div class="task-inspector-title">
        <span>🎯</span>
        <span>Scheduled To-Do Task List (Live Inspector)</span>
      </div>
      <button id="btnClearTodos" style="background:transparent; border:1px solid var(--border-subtle); color:var(--text-muted); border-radius:4px; font-size:0.7rem; padding:2px 8px; cursor:pointer;">Clear Todos</button>
    </div>
    <div id="liveTodoList">
      <!-- Live rendered todos -->
    </div>
  </div>
</div>

<!-- Global Toast -->
<div id="demoToast">
  <span id="toastIcon">⚡</span>
  <span id="toastMsg">Action completed</span>
</div>

<!-- Engine & Component Scripts -->
<script src="task-habit-engine.js"></script>
<script src="ui-scratchpad.js"></script>

<script>
  function showToast(msg, icon = '✓') {
    const toast = document.getElementById('demoToast');
    const msgEl = document.getElementById('toastMsg');
    const iconEl = document.getElementById('toastIcon');
    if (!toast) return;
    iconEl.textContent = icon;
    msgEl.textContent = msg;
    toast.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // MeApp Mock for toast notifications
  window.MeApp = {
    showToast: showToast,
    renderTodos: renderLiveTodoList,
    renderScratchpad: () => {}
  };

  // Render the live todo list
  function renderLiveTodoList() {
    const container = document.getElementById('liveTodoList');
    if (!container) return;

    let todos = [];
    if (window.TaskHabitEngine && window.TaskHabitEngine.todos) {
      todos = window.TaskHabitEngine.todos.getAll();
    } else {
      try {
        const raw = localStorage.getItem('me_tasks_todos');
        todos = raw ? JSON.parse(raw) : [];
      } catch (e) {
        todos = [];
      }
    }

    if (todos.length === 0) {
      container.innerHTML = `
        <div style="text-align: center; color: var(--text-muted); font-size: 0.78rem; padding: 12px 0;">
          No scheduled tasks yet. Click <strong>'⚡ Convert to To-Do'</strong> on any scratchpad note above to test instant escalation!
        </div>
      `;
      return;
    }

    container.innerHTML = todos.slice(0, 8).map(t => `
      <div class="task-entry">
        <div style="color: var(--mint); font-weight: 700; margin-top: 1px;">✓</div>
        <div style="flex: 1;">
          <div style="font-weight: 600; color: var(--text-primary);">${t.title}</div>
          <div style="font-size: 0.72rem; color: var(--text-secondary); margin-top: 2px; white-space: pre-wrap;">${t.description || ''}</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
          <span style="font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; background: rgba(124, 92, 252, 0.15); color: #c4b5fd; border: 1px solid rgba(124, 92, 252, 0.3);">
            ${t.category || 'Task'}
          </span>
          <span style="font-size: 0.65rem; color: var(--text-muted);">
            ${t.dueDate || 'Today'}
          </span>
        </div>
      </div>
    `).join('');
  }

  // Clear todos handler
  document.getElementById('btnClearTodos').onclick = () => {
    if (window.TaskHabitEngine && window.TaskHabitEngine.todos) {
      const all = window.TaskHabitEngine.todos.getAll();
      all.forEach(t => window.TaskHabitEngine.todos.deleteTask(t.id));
    }
    localStorage.removeItem('me_tasks_todos');
    renderLiveTodoList();
    showToast('Task list cleared', '🗑️');
  };

  // Mount Agent 6 Somebody Told Me Scratchpad
  document.addEventListener('DOMContentLoaded', () => {
    const mount = document.getElementById('scratchpadMount');
    window.scratchpadInstance = new SomebodyToldMeUI(mount, {
      enableFab: true,
      onConvert: (res) => {
        renderLiveTodoList();
        showToast(`Escalated to "${res.task.category}"!`, '⚡');
      },
      onAdd: (note) => {
        showToast(`Captured note from ${note.person}`, '👂');
      }
    });

    renderLiveTodoList();
  });
</script>

</body>
</html>
