<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food & Health Intelligence — Me PWA</title>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a24;
      --card-hover: #22222f;
      --accent: #7c5cfc;
      --accent-glow: #7c5cfc44;
      --green: #22c55e;
      --green-dim: #22c55e33;
      --red: #ef4444;
      --red-dim: #ef444433;
      --yellow: #f59e0b;
      --yellow-dim: #f59e0b33;
      --text: #e4e4ef;
      --text-dim: #8888a4;
      --border: #2a2a3a;
      --radius: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 80px;
    }

    .demo-container {
      max-width: 600px;
      margin: 0 auto;
    }

    .demo-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .demo-header h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
    .demo-header h1 span { color: var(--accent); }
    .demo-header p { font-size: 0.85rem; color: var(--text-dim); }
  </style>
</head>
<body>

<div class="demo-container">
  <div class="demo-header">
    <h1>🥗 Food & Health <span>Intelligence</span></h1>
    <p>Agent 3 Specification & Live Interactive UI Component</p>
  </div>

  <div id="foodHealthContainer"></div>
</div>

<script src="ui-food.js"></script>
<script>
  // Initialize Food & Health component standalone
  renderFoodTab('foodHealthContainer');
</script>

</body>
</html>
